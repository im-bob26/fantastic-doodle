<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Vibe — Chat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0d0d10; --surface: #16161b; --surface2: #1e1e26; --surface3: #252530;
  --border: #2a2a38; --accent: #7c6af7; --accent2: #5eead4; --danger: #f87171;
  --text: #e8e8f0; --text2: #8888a8; --text3: #555568; --online: #4ade80;
  --radius: 14px; --radius-sm: 8px; --shadow: 0 4px 32px rgba(0,0,0,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body { height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
input, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* LAYOUT */
#app { display: flex; height: 100dvh; width: 100vw; overflow: hidden; position: fixed; top: 0; left: 0; }
.screen { display: none; width: 100%; height: 100%; overflow: hidden; }
.screen.active { display: flex; }

/* AUTH */
#auth-screen { flex-direction: column; align-items: center; justify-content: center; background: var(--bg); padding: 24px; position: relative; overflow: hidden; }
#auth-screen::before { content: ''; position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(124,106,247,0.15) 0%, transparent 70%); top: -200px; left: -200px; pointer-events: none; }
#auth-screen::after { content: ''; position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(94,234,212,0.1) 0%, transparent 70%); bottom: -100px; right: -100px; pointer-events: none; }
.auth-logo { font-family: 'Space Mono', monospace; font-size: 42px; font-weight: 700; letter-spacing: -2px; margin-bottom: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.auth-tagline { color: var(--text2); font-size: 15px; margin-bottom: 40px; text-align: center; }
.auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; position: relative; z-index: 1; box-shadow: var(--shadow); }
.auth-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 28px; }
.auth-tab { flex: 1; padding: 9px; border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--text2); transition: all 0.2s; }
.auth-tab.active { background: var(--surface2); color: var(--text); }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px; }
.field input { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 15px; color: var(--text); transition: border-color 0.2s; }
.field input:focus { border-color: var(--accent); }
.auth-btn { width: 100%; padding: 13px; background: var(--accent); border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; color: #fff; transition: opacity 0.2s, transform 0.1s; margin-top: 4px; }
.auth-btn:hover { opacity: 0.9; } .auth-btn:active { transform: scale(0.98); } .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.auth-error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }

/* MAIN */
#main-screen { flex-direction: row; overflow: hidden; width: 100%; height: 100dvh; }

/* SIDEBAR */
#sidebar { width: 260px; min-width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100dvh; transition: transform 0.3s; flex-shrink: 0; }
.sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
.logo-small { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header-actions { display: flex; gap: 2px; }
.icon-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--text2); transition: all 0.15s; font-size: 16px; flex-shrink: 0; }
.icon-btn:hover { background: var(--surface2); color: var(--text); }
.sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
.sidebar-tab { flex: 1; padding: 10px 6px; font-size: 12px; font-weight: 600; color: var(--text3); text-align: center; border-bottom: 2px solid transparent; transition: all 0.15s; }
.sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.online-bar { padding: 6px 14px; font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
.online-bar:hover { background: var(--surface2); }
.online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); box-shadow: 0 0 6px var(--online); flex-shrink: 0; }
.list-section { flex: 1; overflow-y: auto; padding: 6px; }
.list-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; padding: 8px 8px 4px; }
.channel-item, .dm-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.1s; position: relative; }
.channel-item:hover, .dm-item:hover { background: var(--surface2); }
.channel-item.active, .dm-item.active { background: var(--surface3); }
.channel-hash { font-size: 16px; color: var(--text3); font-family: 'Space Mono', monospace; line-height: 1; }
.channel-name { font-size: 13px; font-weight: 500; color: var(--text2); flex: 1; }
.channel-item.active .channel-name, .dm-item.active .dm-name { color: var(--text); }
.unread-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 2px 6px; min-width: 18px; text-align: center; }
.dm-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; background: var(--surface3); position: relative; }
.status-ring { position: absolute; bottom: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--online); border: 2px solid var(--surface); }
.dm-name { font-size: 13px; font-weight: 500; color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-footer { padding: 8px 10px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.my-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; background: var(--accent); color: #fff; }
.my-info { flex: 1; min-width: 0; }
.my-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.my-status { font-size: 11px; color: var(--text3); }

/* CHAT AREA */
#chat-area { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--surface); flex-shrink: 0; }
.menu-btn { display: none; font-size: 20px; color: var(--text2); }
.chat-channel-info { flex: 1; min-width: 0; }
.chat-channel-name { font-size: 15px; font-weight: 600; color: var(--text); }
.chat-channel-desc { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-header-actions { display: flex; gap: 2px; }

/* MESSAGES */
#messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 1px; }
.msg-row { display: flex; align-items: flex-start; gap: 10px; padding: 2px 0; border-radius: 8px; transition: background 0.1s; }
.msg-row:hover { background: rgba(255,255,255,0.02); }
.msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 1px; cursor: pointer; transition: opacity 0.15s; }
.msg-avatar:hover { opacity: 0.8; }
.msg-avatar.hidden { visibility: hidden; pointer-events: none; }
.msg-content { flex: 1; min-width: 0; }
.msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.msg-author { font-size: 13px; font-weight: 600; cursor: pointer; }
.msg-author:hover { text-decoration: underline; }
.msg-time { font-size: 10px; color: var(--text3); }
.msg-bubble { font-size: 14px; line-height: 1.55; color: var(--text); word-break: break-word; white-space: pre-wrap; }

/* Game card in chat */
.game-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-top: 4px; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
.game-card-title { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
.game-card-desc { font-size: 12px; color: var(--text3); }
.game-card-btn { background: var(--accent); color: #fff; border-radius: var(--radius-sm); padding: 8px 16px; font-size: 13px; font-weight: 600; transition: opacity 0.15s; align-self: flex-start; }
.game-card-btn:hover { opacity: 0.85; }
.game-card-btn.secondary { background: var(--surface3); color: var(--text2); cursor: default; }
.game-card-btn.started { background: rgba(74,222,128,0.15); color: #4ade80; cursor: default; }

.msg-date-divider { display: flex; align-items: center; gap: 12px; color: var(--text3); font-size: 11px; font-weight: 600; margin: 14px 0; }
.msg-date-divider::before, .msg-date-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* TYPING */
#typing-bar { padding: 2px 16px 4px; font-size: 12px; color: var(--text3); min-height: 20px; flex-shrink: 0; }
.typing-dots span { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--text3); margin: 0 1px; animation: typing-bounce 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing-bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

/* INPUT */
.chat-input-area { padding: 8px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); flex-shrink: 0; position: relative; }
.input-toolbar { display: flex; gap: 4px; margin-bottom: 6px; }
.toolbar-btn { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; color: var(--text3); transition: all 0.15s; background: var(--surface2); }
.toolbar-btn:hover { background: var(--surface3); color: var(--text); }
.chat-input-box { background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius); display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px; transition: border-color 0.2s; }
.chat-input-box:focus-within { border-color: var(--accent); }
#msg-input { flex: 1; font-size: 14px; color: var(--text); resize: none; line-height: 1.5; max-height: 100px; min-height: 22px; background: transparent; }
#msg-input::placeholder { color: var(--text3); }
.input-actions { display: flex; gap: 4px; align-items: flex-end; }
.emoji-btn { color: var(--text3); font-size: 18px; padding: 2px; border-radius: 6px; transition: all 0.15s; line-height: 1; }
.emoji-btn:hover { color: var(--text); }
.send-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; flex-shrink: 0; }
.send-btn:hover { opacity: 0.9; transform: scale(1.05); } .send-btn:disabled { opacity: 0.4; transform: none; }
.emoji-picker { position: absolute; bottom: 70px; right: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; display: none; flex-wrap: wrap; gap: 3px; max-width: 260px; box-shadow: var(--shadow); z-index: 100; }
.emoji-picker.open { display: flex; }
.emoji-option { font-size: 20px; padding: 4px; border-radius: 6px; cursor: pointer; transition: background 0.1s; }
.emoji-option:hover { background: var(--surface2); }

/* GAME PICKER POPUP */
.game-picker { position: absolute; bottom: 70px; left: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; display: none; gap: 8px; box-shadow: var(--shadow); z-index: 100; min-width: 200px; }
.game-picker.open { display: flex; flex-direction: column; }
.game-picker-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; margin-bottom: 4px; }
.game-option { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.15s; }
.game-option:hover { background: var(--surface2); }
.game-option-icon { font-size: 24px; }
.game-option-info { flex: 1; }
.game-option-name { font-size: 14px; font-weight: 600; color: var(--text); }
.game-option-desc { font-size: 11px; color: var(--text3); }

/* RIGHT PANEL */
#right-panel { width: 280px; min-width: 280px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; transform: translateX(100%); transition: transform 0.3s; position: absolute; right: 0; top: 0; z-index: 50; }
#right-panel.open { transform: translateX(0); position: relative; }
.panel-header { padding: 14px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.panel-title { font-size: 15px; font-weight: 600; }
.panel-close { color: var(--text3); font-size: 18px; border-radius: 6px; padding: 2px 6px; }
.panel-close:hover { background: var(--surface2); color: var(--text); }
.panel-body { flex: 1; overflow-y: auto; padding: 10px; }

/* FRIENDS PANEL */
.friend-search-box { display: flex; gap: 6px; margin-bottom: 10px; }
.friend-search-box input { flex: 1; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; color: var(--text); transition: border-color 0.2s; }
.friend-search-box input:focus { border-color: var(--accent); }
.add-friend-btn { background: var(--accent); color: #fff; border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; font-weight: 600; transition: opacity 0.15s; white-space: nowrap; }
.add-friend-btn:hover { opacity: 0.9; }
.friend-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.1s; }
.friend-item:hover { background: var(--surface2); }
.friend-info { flex: 1; min-width: 0; }
.friend-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.friend-status { font-size: 11px; color: var(--text3); }
.friend-actions { display: flex; gap: 3px; }
.friend-btn { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.15s; }
.friend-btn.accept { background: rgba(74,222,128,0.15); color: #4ade80; }
.friend-btn.accept:hover { background: rgba(74,222,128,0.25); }
.friend-btn.reject, .friend-btn.remove { background: rgba(248,113,113,0.15); color: var(--danger); }
.friend-btn.reject:hover, .friend-btn.remove:hover { background: rgba(248,113,113,0.25); }
.friend-btn.dm { background: rgba(124,106,247,0.15); color: var(--accent); }
.friend-btn.dm:hover { background: rgba(124,106,247,0.25); }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; padding: 8px 8px 4px; }

/* ONLINE PLAYERS PANEL */
.online-player-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--radius-sm); transition: background 0.1s; }
.online-player-item:hover { background: var(--surface2); cursor: pointer; }
.online-player-name { font-size: 13px; font-weight: 500; flex: 1; }
.online-player-status { font-size: 11px; color: var(--text3); }
.add-from-online-btn { background: rgba(124,106,247,0.15); color: var(--accent); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; transition: all 0.15s; }
.add-from-online-btn:hover { background: rgba(124,106,247,0.3); }
.add-from-online-btn.sent { background: rgba(74,222,128,0.1); color: #4ade80; cursor: default; }

/* SETTINGS */
.settings-section { margin-bottom: 18px; }
.settings-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
.color-grid { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.15s; }
.color-swatch.selected { border-color: var(--text); transform: scale(1.15); }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); }
.settings-row:last-child { border-bottom: none; }
.settings-row-label { font-size: 13px; color: var(--text2); }
.toggle { width: 38px; height: 22px; background: var(--surface3); border-radius: 11px; position: relative; cursor: pointer; transition: background 0.2s; }
.toggle.on { background: var(--accent); }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.toggle.on::after { transform: translateX(16px); }
.status-options { display: flex; gap: 5px; flex-wrap: wrap; }
.status-opt { padding: 4px 9px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; background: var(--surface3); color: var(--text2); cursor: pointer; transition: all 0.15s; }
.status-opt[data-s="online"].active { background: rgba(74,222,128,0.2); color: #4ade80; }
.status-opt[data-s="away"].active { background: rgba(250,204,21,0.2); color: #facc15; }
.status-opt[data-s="dnd"].active { background: rgba(248,113,113,0.2); color: var(--danger); }

/* TOAST */
#toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--text); box-shadow: var(--shadow); animation: toast-in 0.3s ease; white-space: nowrap; }
.toast.success { border-color: rgba(74,222,128,0.4); color: #4ade80; }
.toast.error { border-color: rgba(248,113,113,0.4); color: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* MOBILE */
@media (max-width: 768px) {
  #sidebar { position: fixed; z-index: 60; left: 0; top: 0; width: 260px; height: 100dvh; transform: translateX(-100%); box-shadow: var(--shadow); }
  #sidebar.mobile-open { transform: translateX(0); }
  .menu-btn { display: flex !important; }
  /* Right panel: compact bottom sheet */
  #right-panel {
    position: fixed !important;
    bottom: 0 !important; left: 0 !important; right: 0 !important; top: auto !important;
    width: 100vw !important; min-width: unset !important;
    height: auto; max-height: 55dvh;
    border-radius: 20px 20px 0 0;
    border-left: none; border-top: 1px solid var(--border);
    transform: translateY(110%) !important;
    transition: transform 0.3s ease;
    z-index: 70;
    display: flex !important;
    flex-direction: column;
    overflow: hidden;
  }
  #right-panel.open { transform: translateY(0) !important; }
  #right-panel .panel-body { overflow-y: auto; }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 55; display: none; }
  .sidebar-overlay.active { display: block; }
  .input-toolbar { display: none; }
}
@media (max-width: 480px) {
  .auth-card { padding: 22px 18px; }
}

/* DESKTOP improvements */
@media (min-width: 769px) {
  #main-screen { position: relative; }
  #right-panel { position: relative !important; transform: none !important; display: none; height: 100dvh; max-height: 100dvh; }
  #right-panel.open { display: flex; }
}

/* MISC */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: var(--text3); gap: 8px; }
.empty-icon { font-size: 36px; }
.empty-text { font-size: 13px; }
.loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.notif-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); position: absolute; top: 2px; right: 2px; border: 2px solid var(--surface); display: none; }
.has-notif .notif-dot { display: block; }

/* User popup on click */
.user-popup { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); z-index: 200; min-width: 200px; display: none; }
.user-popup.open { display: block; }
.user-popup-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.user-popup-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; }
.user-popup-name { font-size: 15px; font-weight: 700; }
.user-popup-username { font-size: 12px; color: var(--text3); }
.user-popup-actions { display: flex; flex-direction: column; gap: 4px; }
.user-popup-btn { padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; text-align: left; transition: background 0.1s; color: var(--text2); }
.user-popup-btn:hover { background: var(--surface2); color: var(--text); }
.user-popup-btn.danger { color: var(--danger); }
.user-popup-btn.danger:hover { background: rgba(248,113,113,0.1); }

/* ============================================================
   INLINE GAME BOARD
   ============================================================ */
.game-status-bar { font-size: 13px; font-weight: 600; padding: 8px 16px; background: var(--surface2); border-radius: var(--radius-sm); border: 1px solid var(--border); text-align: center; width: 100%; }
.game-status-bar.your-turn { border-color: var(--accent); color: var(--accent); background: rgba(124,106,247,0.1); }
.game-status-bar.won { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.1); }
.game-status-bar.lost { border-color: var(--danger); color: var(--danger); background: rgba(248,113,113,0.1); }
.game-status-bar.draw { border-color: #facc15; color: #facc15; background: rgba(250,204,21,0.1); }
.game-resign-btn { font-size: 12px; color: var(--text3); padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); transition: all 0.15s; }
.game-resign-btn:hover { border-color: var(--danger); color: var(--danger); }
/* Inline board wrapper — sits directly in the message list */
.inline-game {
  margin: 6px 0 10px 44px; /* indent to align with message text */
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
  max-width: 520px;
  animation: game-in 0.2s ease;
}
@keyframes game-in { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: none; } }
.inline-game-header {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  font-size: 13px; font-weight: 600; color: var(--text2);
}
.inline-game-header .gi-title { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 14px; }
.inline-game-collapse { font-size: 11px; color: var(--text3); padding: 2px 7px; border-radius: 5px; border: 1px solid var(--border); transition: all 0.15s; }
.inline-game-collapse:hover { border-color: var(--accent); color: var(--accent); }

/* ============================================================
   CONNECT 4
   ============================================================ */
.c4-board {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 6px; padding: 14px;
  background: #1a2a6e; border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,40,0.6);
}
.c4-cell {
  width: 46px; height: 46px; border-radius: 50%;
  background: #0d0d10; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  position: relative; overflow: hidden;
}
.c4-cell:hover { transform: scale(1.05); }
.c4-cell.p1 { background: #f87171; box-shadow: 0 0 10px rgba(248,113,113,0.5); }
.c4-cell.p2 { background: #facc15; box-shadow: 0 0 10px rgba(250,204,21,0.5); }
.c4-cell.win-cell { animation: c4-pulse 0.6s infinite alternate; }
@keyframes c4-pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
.c4-legend { display: flex; gap: 16px; font-size: 12px; color: var(--text2); }
.c4-legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
@media (max-width: 480px) { .c4-cell { width: 38px; height: 38px; } .c4-board { gap: 5px; padding: 10px; } }

/* ============================================================
   CHESS
   ============================================================ */
.chess-board-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chess-board {
  display: grid; grid-template-columns: repeat(8, 1fr);
  border: 2px solid var(--border); border-radius: 8px; overflow: hidden;
  box-shadow: 0 4px 32px rgba(0,0,0,0.6);
}
.chess-square {
  width: 52px; height: 52px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; cursor: pointer; position: relative;
  transition: background 0.1s;
  user-select: none;
}
.chess-square.light { background: #f0d9b5; }
.chess-square.dark  { background: #b58863; }
.chess-square.selected { background: #7fc97f !important; }
.chess-square.valid-move { background: rgba(127,201,127,0.55) !important; }
.chess-square.valid-move::after { content: ''; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.2); position: absolute; }
.chess-square.last-move { background: rgba(255,210,80,0.55) !important; }
.chess-square.in-check { background: rgba(248,113,113,0.7) !important; }
.chess-rank-labels { display: flex; flex-direction: column-reverse; font-size: 10px; color: var(--text3); gap: 0; font-family: 'Space Mono', monospace; }
.chess-rank-labels span { height: 52px; display: flex; align-items: center; }
.chess-file-labels { display: flex; font-size: 10px; color: var(--text3); font-family: 'Space Mono', monospace; }
.chess-file-labels span { width: 52px; text-align: center; }
.chess-row { display: flex; }
.chess-captured { display: flex; flex-wrap: wrap; gap: 2px; font-size: 18px; min-height: 24px; }
@media (max-width: 480px) { .chess-square { width: 40px; height: 40px; font-size: 24px; } .chess-rank-labels span { height: 40px; } .chess-file-labels span { width: 40px; } }
</style>

<body>
<div id="app">

        <div class="game-option" onclick="sendGameChallenge('chess')">

        </div>
        <div class="game-option" onclick="sendGameChallenge('connect4')">
          <span class="game-option-icon">🔴</span>

<script>
const SUPABASE_URL = 'https://djsjmkxdcshwdcgjjqgl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqc2pta3hkY3Nod2RjZ2pqcWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2Mzc4MjIsImV4cCI6MjA5NTIxMzgyMn0.MW41C3Nrf7kA85yOCFiyZilq-yC5gAVNajWT-xP4Ew0';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentChannel = { id: 'general', name: 'general', type: 'channel' };
let messagesSub = null, typingSub = null, presenceSub = null;
let typingTimeout = null, typingUsers = {}, onlineUsers = {}, onlineUserData = {};
let friendRequests = [], friends = [], unreadDMs = {};
let currentTab = 'channels', rightPanelMode = null;

const CHANNELS = [
  { id: 'general', name: 'general', desc: 'The main hangout' },
  { id: 'random', name: 'random', desc: 'Anything goes' },
  { id: 'gaming', name: 'gaming', desc: 'Talk about games' },
  { id: 'music', name: 'music', desc: 'Share your playlists' },
  { id: 'tech', name: 'tech', desc: 'Tech talk' },
];
const EMOJIS = ['😀','😂','😍','🥰','😎','🤔','😢','😡','🥳','🎉','🔥','❤️','👍','👎','🙏','💯','✨','🎮','🎵','💻','🚀','🌙','⭐','🌈','🍕','☕','🧠','👀','💀','🤣'];
const USER_COLORS = ['#7c6af7','#f472b6','#5eead4','#fb923c','#a3e635','#38bdf8','#e879f9','#facc15'];
const GAME_INFO = {
  chess: { icon: '♟️', name: 'Chess', desc: 'Classic strategy game' },
  connect4: { icon: '🔴', name: 'Connect 4', desc: 'Get 4 in a row to win' }
};

// ===== AUTH =====
let authMode = 'login';
function switchTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
  document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
  document.getElementById('display-name-field').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('auth-error').style.display = 'none';
}
document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
document.getElementById('auth-username').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });

async function handleAuth() {
  const username = document.getElementById('auth-username').value.trim().toLowerCase();
  const password = document.getElementById('auth-password').value;
  const displayName = document.getElementById('auth-displayname').value.trim();
  const btn = document.getElementById('auth-submit-btn');
  if (!username || !password) { showAuthError('Please fill in all fields.'); return; }
  if (username.length < 3) { showAuthError('Username must be at least 3 characters.'); return; }
  if (password.length < 4) { showAuthError('Password must be at least 4 characters.'); return; }
  if (authMode === 'register' && !displayName) { showAuthError('Please enter a display name.'); return; }
  btn.disabled = true;
  btn.textContent = authMode === 'login' ? 'Signing in…' : 'Creating account…';
  try {
    if (authMode === 'register') {
      const { data: existing } = await sb.from('users').select('id').eq('username', username).single();
      if (existing) { showAuthError('Username already taken.'); btn.disabled = false; btn.textContent = 'Create Account'; return; }
      const colorIndex = Math.floor(Math.random() * USER_COLORS.length);
      const { data, error } = await sb.from('users').insert({ username, display_name: displayName, password_hash: btoa(password), color_index: colorIndex, status: 'online' }).select().single();
      if (error) throw error;
      currentUser = data;
    } else {
      const { data, error } = await sb.from('users').select('*').eq('username', username).eq('password_hash', btoa(password)).single();
      if (error || !data) { showAuthError('Invalid username or password.'); btn.disabled = false; btn.textContent = 'Sign In'; return; }
      currentUser = data;
    }
    localStorage.setItem('vibe_user_id', currentUser.id);
    await sb.from('users').update({ status: 'online', last_seen: new Date().toISOString() }).eq('id', currentUser.id);
    enterApp();
  } catch (e) {
    showAuthError(e.message || 'Something went wrong.');
    btn.disabled = false; btn.textContent = authMode === 'login' ? 'Sign In' : 'Create Account';
  }
}
function showAuthError(msg) { const el = document.getElementById('auth-error'); el.textContent = msg; el.style.display = 'block'; }
async function tryAutoLogin() {
  const uid = localStorage.getItem('vibe_user_id');
  if (!uid) return;
  const { data } = await sb.from('users').select('*').eq('id', uid).single();
  if (data) { currentUser = data; enterApp(); }
}

// ===== ENTER APP =====
async function enterApp() {
  document.getElementById('auth-screen').classList.remove('active');
  document.getElementById('main-screen').classList.add('active');
  const initials = currentUser.display_name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('my-avatar').textContent = initials;
  document.getElementById('my-avatar').style.background = USER_COLORS[currentUser.color_index] || '#7c6af7';
  document.getElementById('my-name').textContent = currentUser.display_name;
  const savedAccent = localStorage.getItem('vibe_accent');
  if (savedAccent) document.documentElement.style.setProperty('--accent', savedAccent);
  setupEmojiPicker();
  renderSidebarList();
  await loadFriends();
  setupPresence();
  switchToChannel(CHANNELS[0]);
}
async function logout() {
  if (currentUser) await sb.from('users').update({ status: 'offline', last_seen: new Date().toISOString() }).eq('id', currentUser.id);
  localStorage.removeItem('vibe_user_id');
  location.reload();
}

// ===== SIDEBAR =====
function renderSidebarList() {
  const el = document.getElementById('sidebar-list');
  el.innerHTML = '';
  if (currentTab === 'channels') {
    el.innerHTML = `<div class="list-label">Channels</div>`;
    CHANNELS.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'channel-item' + (currentChannel.id === ch.id ? ' active' : '');
      div.innerHTML = `<span class="channel-hash">#</span><span class="channel-name">${ch.name}</span>`;
      div.onclick = () => switchToChannel(ch);
      el.appendChild(div);
    });
  } else {
    el.innerHTML = `<div class="list-label">Direct Messages</div>`;
    if (friends.length === 0) { el.innerHTML += `<div style="padding:14px 8px;color:var(--text3);font-size:13px">Add friends to start DMs!</div>`; }
    friends.forEach(f => {
      const dmId = getDMId(currentUser.id, f.id);
      const isActive = currentChannel.type === 'dm' && currentChannel.id === dmId;
      const isOnline = !!onlineUsers[f.id];
      const initials = f.display_name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      const div = document.createElement('div');
      div.className = 'dm-item' + (isActive ? ' active' : '');
      const unread = unreadDMs[dmId] ? `<span class="unread-badge">${unreadDMs[dmId]}</span>` : '';
      div.innerHTML = `
        <div class="dm-avatar" style="background:${USER_COLORS[f.color_index]||'#7c6af7'};color:#fff">
          ${initials}${isOnline ? '<span class="status-ring"></span>' : ''}
        </div>
        <span class="dm-name">${f.display_name}</span>${unread}`;
      div.onclick = () => switchToDM(f);
      el.appendChild(div);
    });
  }
}
function switchSideTab(tab) {
  currentTab = tab;
  document.getElementById('stab-channels').classList.toggle('active', tab === 'channels');
  document.getElementById('stab-dms').classList.toggle('active', tab === 'dms');
  renderSidebarList();
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('mobile-open'); document.getElementById('sidebar-overlay').classList.toggle('active'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('mobile-open'); document.getElementById('sidebar-overlay').classList.remove('active'); }

// ===== CHANNELS / DMS =====
async function switchToChannel(ch) {
  currentChannel = { id: ch.id, name: ch.name, type: 'channel', desc: ch.desc };
  document.getElementById('chat-channel-name').textContent = `# ${ch.name}`;
  document.getElementById('chat-channel-desc').textContent = ch.desc;
  renderSidebarList(); closeSidebar();
  await loadMessages(); subscribeToMessages(); subscribeToTyping();
}
async function switchToDM(friend) {
  const dmId = getDMId(currentUser.id, friend.id);
  currentChannel = { id: dmId, name: friend.display_name, type: 'dm', friendId: friend.id };
  document.getElementById('chat-channel-name').textContent = `💬 ${friend.display_name}`;
  document.getElementById('chat-channel-desc').textContent = 'Direct message';
  delete unreadDMs[dmId];
  renderSidebarList(); closeSidebar(); closePanel();
  await loadMessages(); subscribeToMessages(); subscribeToTyping();
}
function getDMId(a, b) { return [a, b].sort().join('__dm__'); }

// ===== MESSAGES =====
async function loadMessages() {
  document.getElementById('messages').innerHTML = `<div class="empty-state"><div class="loading-spinner"></div></div>`;
  const { data, error } = await sb.from('messages').select('*, users(id,display_name,color_index,username)').eq('channel_id', currentChannel.id).order('created_at', { ascending: true }).limit(100);
  if (error) { document.getElementById('messages').innerHTML = `<div class="empty-state"><span class="empty-icon">⚠️</span><span class="empty-text">Could not load messages</span></div>`; return; }
  renderMessages(data || []);
}

function renderMessages(msgs) {
  const container = document.getElementById('messages');
  if (!msgs || msgs.length === 0) { container.innerHTML = `<div class="empty-state"><span class="empty-icon">💬</span><span class="empty-text">No messages yet. Say hi!</span></div>`; return; }
  container.innerHTML = '';
  let lastAuthor = null, lastDate = null;
  msgs.forEach(msg => {
    const date = new Date(msg.created_at);
    const dateStr = date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    if (dateStr !== lastDate) {
      const div = document.createElement('div'); div.className = 'msg-date-divider'; div.textContent = dateStr;
      container.appendChild(div); lastDate = dateStr; lastAuthor = null;
    }
    const sameAuthor = lastAuthor === msg.user_id;
    const msgEl = buildMessageEl(msg, sameAuthor);
    if (msg.id) msgEl.dataset.msgId = msg.id;
    container.appendChild(msgEl);
    // Inject inline game board container right after the message row
    if (msgEl.dataset.gameSession) {
      const sid = msgEl.dataset.gameSession;
      const existing = document.getElementById('igame-'+sid);
      if (!existing) {
        const gameDiv = document.createElement('div');
        gameDiv.id = 'igame-'+sid;
        gameDiv.className = 'inline-game';
        gameDiv.style.display = 'none';
        gameDiv.innerHTML = `<div class="inline-game-header">
          <span class="gi-title">${GAME_INFO[msgEl.dataset.gameType]?.icon||'🎮'} ${GAME_INFO[msgEl.dataset.gameType]?.name||'Game'} — Live Board</span>
          <button class="inline-game-collapse" onclick="collapseInlineGame('${sid}')">✕ Close</button>
        </div><div id="igame-inner-${sid}"></div>`;
        container.appendChild(gameDiv);
      }
      // Auto-open for challenger (isOwn) so they see waiting screen
      if (msg.user_id === currentUser?.id && msg.id) {
        const sid2 = msgEl.dataset.gameSession;
        if (sid2 && !sid2.startsWith('local_')) {
          setTimeout(() => openInlineGame(sid2, msgEl.dataset.gameType, true), 100);
        }
      }
    }
    lastAuthor = msg.user_id;
  });
  container.scrollTop = container.scrollHeight;
}

function buildMessageEl(msg, sameAuthor) {
  const isOwn = msg.user_id === currentUser?.id;
  const user = msg.users || {};
  const displayName = user.display_name || 'Unknown';
  const colorIdx = user.color_index ?? 0;
  const color = USER_COLORS[colorIdx] || '#7c6af7';
  const initials = displayName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const date = new Date(msg.created_at);
  const timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

  const row = document.createElement('div');
  row.className = 'msg-row';

  let bubbleContent = '';
  if (msg.content && msg.content.startsWith('__GAME__:')) {
    try {
      const gdata = JSON.parse(msg.content.replace('__GAME__:', ''));
      const sid = gdata.sessionId || '';
      const cardHtml = buildGameCard(gdata, user, isOwn);
      // Inline board container — hidden until someone opens the game
      bubbleContent = `${cardHtml}`;
      // We also inject the inline game container as a sibling element via data attr
      row.dataset.gameSession = sid;
      row.dataset.gameType = gdata.type || '';
    } catch(e) { bubbleContent = `<div class="msg-bubble">${escHTML(msg.content)}</div>`; }
  } else {
    bubbleContent = `<div class="msg-bubble">${escHTML(msg.content)}</div>`;
  }

  const avatarHtml = `<div class="msg-avatar${sameAuthor?' hidden':''}" style="background:${color};color:#fff" onclick="showUserPopup(event,${JSON.stringify(user).replace(/"/g,'&quot;')})">${initials}</div>`;
  const headerHtml = sameAuthor ? '' : `<div class="msg-header"><span class="msg-author" style="color:${color}" onclick="showUserPopup(event,${JSON.stringify(user).replace(/"/g,'&quot;')})">${escHTML(displayName)}</span><span class="msg-time">${timeStr}</span></div>`;

  row.innerHTML = `${avatarHtml}<div class="msg-content">${headerHtml}${bubbleContent}</div>`;
  return row;
}

function subscribeToMessages() {
  messagesSub && sb.removeChannel(messagesSub);
  messagesSub = sb.channel(`msgs:${currentChannel.id}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `channel_id=eq.${currentChannel.id}` }, async payload => {
      const msg = payload.new;
      const { data: ud } = await sb.from('users').select('id,display_name,color_index,username').eq('id', msg.user_id).single();
      msg.users = ud;
      const container = document.getElementById('messages');
      if (container.querySelector('.empty-state')) container.innerHTML = '';
      const lastRow = container.lastElementChild;
      const lastAuthorId = lastRow?.dataset?.authorId;
      const sameAuthor = lastAuthorId == msg.user_id;
      const el = buildMessageEl(msg, sameAuthor);
      el.dataset.authorId = msg.user_id;
      el.dataset.msgId = msg.id;
      container.appendChild(el);
      // Inject inline game board container if this is a game message
      if (el.dataset.gameSession) {
        const sid = el.dataset.gameSession;
        if (!document.getElementById('igame-'+sid)) {
          const gameDiv = document.createElement('div');
          gameDiv.id = 'igame-'+sid;
          gameDiv.className = 'inline-game';
          gameDiv.style.display = 'none';
          gameDiv.innerHTML = `<div class="inline-game-header">
            <span class="gi-title">${GAME_INFO[el.dataset.gameType]?.icon||'🎮'} ${GAME_INFO[el.dataset.gameType]?.name||'Game'} — Live Board</span>
            <button class="inline-game-collapse" onclick="collapseInlineGame('${sid}')">✕ Close</button>
          </div><div id="igame-inner-${sid}"></div>`;
          container.appendChild(gameDiv);
        }
        // Auto-open for the challenger
        if (msg.user_id === currentUser?.id && !sid.startsWith('local_')) {
          setTimeout(() => openInlineGame(sid, el.dataset.gameType, true), 100);
        }
      }
      const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 150;
      if (nearBottom || msg.user_id === currentUser?.id) container.scrollTop = container.scrollHeight;
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages', filter: `channel_id=eq.${currentChannel.id}` }, async payload => {
      const msg = payload.new;
      if (!msg.content || !msg.content.startsWith('__GAME__:')) return;
      const container = document.getElementById('messages');
      const existing = container.querySelector(`[data-msg-id="${msg.id}"]`);
      if (!existing) return;
      const { data: ud } = await sb.from('users').select('id,display_name,color_index,username').eq('id', msg.user_id).single();
      msg.users = ud;
      const hasHeader = !!existing.querySelector('.msg-header');
      const newEl = buildMessageEl(msg, !hasHeader);
      newEl.dataset.authorId = msg.user_id;
      newEl.dataset.msgId = msg.id;
      existing.replaceWith(newEl);
    })
    .subscribe();
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content || !currentUser) return;
  input.value = ''; autoResize(input);
  document.getElementById('send-btn').disabled = true;

}

// ===== GAMES =====
let activeGameSub = null;
let activeGameId = null;
let activeGameType = null;
// chess state
let chessBoard = null, chessSelected = null, chessValidMoves = [], chessTurn = 'w', chessLastMove = null, chessGameOver = false;
let chessPlayerColor = null; // 'w' or 'b'
// ===== GAMES — INLINE SYSTEM =====
// Each active game lives in inlineGames map: sessionId -> { type, myPiece/myColor, sub, board state... }
const inlineGames = new Map();

// ---- C4 state per session ----
// ---- Chess state per session ----
const CHESS_PIECES = {
  wK:'♔',wQ:'♕',wR:'♖',wB:'♗',wN:'♘',wP:'♙',
  bK:'♚',bQ:'♛',bR:'♜',bB:'♝',bN:'♞',bP:'♟'
};

function initC4Board() { return Array(6).fill(null).map(()=>Array(7).fill(0)); }
function initChessBoard() {
  const back = ['R','N','B','Q','K','B','N','R'];
  return Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>{
    if(r===0) return 'b'+back[c]; if(r===1) return 'bP';
    if(r===6) return 'wP'; if(r===7) return 'w'+back[c]; return null;
  }));
}

// -- Send challenge: post card + create session --
async function sendGameChallenge(type) {
  if (!currentUser) return;
  closeGamePicker();
  const { data: session, error } = await sb.from('game_sessions').insert({
    type, channel_id: currentChannel.id,

    state: JSON.stringify(type==='chess' ? { board: initChessBoard(), turn:'w', captured:{w:[],b:[]}, lastMove:null } : { board: initC4Board(), turn:1 })
  }).select().single();
