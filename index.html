<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Vibe — Chat</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0d0d10; --surface: #16161b; --surface2: #1e1e26; --surface3: #252530;
  --border: #2a2a38; --accent: #7c6af7; --accent2: #5eead4; --danger: #f87171;
  --text: #e8e8f0; --text2: #8888a8; --text3: #555568; --online: #4ade80;
  --radius: 14px; --radius-sm: 8px; --shadow: 0 4px 32px rgba(0,0,0,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body { height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
input, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
#app { display: flex; height: 100dvh; width: 100vw; overflow: hidden; position: fixed; top: 0; left: 0; }
.screen { display: none; width: 100%; height: 100%; overflow: hidden; }
.screen.active { display: flex; }
/* AUTH */
#auth-screen { flex-direction: column; align-items: center; justify-content: center; background: var(--bg); padding: 24px; position: relative; overflow: hidden; }
#auth-screen::before { content: ''; position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(124,106,247,0.15) 0%, transparent 70%); top: -200px; left: -200px; pointer-events: none; }
#auth-screen::after { content: ''; position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(94,234,212,0.1) 0%, transparent 70%); bottom: -100px; right: -100px; pointer-events: none; }
.auth-logo { font-family: 'Space Mono', monospace; font-size: 42px; font-weight: 700; letter-spacing: -2px; margin-bottom: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.auth-tagline { color: var(--text2); font-size: 15px; margin-bottom: 40px; text-align: center; }
.auth-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; position: relative; z-index: 1; box-shadow: var(--shadow); }
.auth-tabs { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 28px; }
.auth-tab { flex: 1; padding: 9px; border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--text2); transition: all 0.2s; }
.auth-tab.active { background: var(--surface2); color: var(--text); }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px; }
.field input { width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 15px; color: var(--text); transition: border-color 0.2s; }
.field input:focus { border-color: var(--accent); }
.auth-btn { width: 100%; padding: 13px; background: var(--accent); border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; color: #fff; transition: opacity 0.2s, transform 0.1s; margin-top: 4px; }
.auth-btn:hover { opacity: 0.9; } .auth-btn:active { transform: scale(0.98); } .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.auth-error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
/* MAIN */
#main-screen { flex-direction: row; overflow: hidden; width: 100%; height: 100dvh; }
/* SIDEBAR */
#sidebar { width: 260px; min-width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100dvh; transition: transform 0.3s; flex-shrink: 0; }
.sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
.logo-small { font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.header-actions { display: flex; gap: 2px; }
.icon-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: var(--text2); transition: all 0.15s; font-size: 16px; flex-shrink: 0; }
.icon-btn:hover { background: var(--surface2); color: var(--text); }
.sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
.sidebar-tab { flex: 1; padding: 10px 6px; font-size: 12px; font-weight: 600; color: var(--text3); text-align: center; border-bottom: 2px solid transparent; transition: all 0.15s; }
.sidebar-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.online-bar { padding: 6px 14px; font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
.online-bar:hover { background: var(--surface2); }
.online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); box-shadow: 0 0 6px var(--online); flex-shrink: 0; }
.list-section { flex: 1; overflow-y: auto; padding: 6px; }
.list-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; padding: 8px 8px 4px; }
.channel-item, .dm-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.1s; position: relative; }
.channel-item:hover, .dm-item:hover { background: var(--surface2); }
.channel-item.active, .dm-item.active { background: var(--surface3); }
.channel-hash { font-size: 16px; color: var(--text3); font-family: 'Space Mono', monospace; line-height: 1; }
.channel-name { font-size: 13px; font-weight: 500; color: var(--text2); flex: 1; }
.channel-item.active .channel-name, .dm-item.active .dm-name { color: var(--text); }
.unread-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 2px 6px; min-width: 18px; text-align: center; }
.dm-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; background: var(--surface3); position: relative; }
.status-ring { position: absolute; bottom: -1px; right: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--online); border: 2px solid var(--surface); }
.dm-name { font-size: 13px; font-weight: 500; color: var(--text2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-footer { padding: 8px 10px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.my-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; background: var(--accent); color: #fff; }
.my-info { flex: 1; min-width: 0; }
.my-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.my-status { font-size: 11px; color: var(--text3); }
/* CHAT AREA */
#chat-area { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--surface); flex-shrink: 0; }
.menu-btn { display: none; font-size: 20px; color: var(--text2); }
.chat-channel-info { flex: 1; min-width: 0; }
.chat-channel-name { font-size: 15px; font-weight: 600; color: var(--text); }
.chat-channel-desc { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-header-actions { display: flex; gap: 2px; }
/* MESSAGES */
#messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 1px; }
.msg-row { display: flex; align-items: flex-start; gap: 10px; padding: 2px 0; border-radius: 8px; transition: background 0.1s; }
.msg-row:hover { background: rgba(255,255,255,0.02); }
.msg-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 1px; cursor: pointer; transition: opacity 0.15s; }
.msg-avatar:hover { opacity: 0.8; }
.msg-avatar.hidden { visibility: hidden; pointer-events: none; }
.msg-content { flex: 1; min-width: 0; }
.msg-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.msg-author { font-size: 13px; font-weight: 600; cursor: pointer; }
.msg-author:hover { text-decoration: underline; }
.msg-time { font-size: 10px; color: var(--text3); }
.msg-bubble { font-size: 14px; line-height: 1.55; color: var(--text); word-break: break-word; white-space: pre-wrap; }
.msg-date-divider { display: flex; align-items: center; gap: 12px; color: var(--text3); font-size: 11px; font-weight: 600; margin: 14px 0; }
.msg-date-divider::before, .msg-date-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
/* TYPING */
#typing-bar { padding: 2px 16px 4px; font-size: 12px; color: var(--text3); min-height: 20px; flex-shrink: 0; }
.typing-dots span { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--text3); margin: 0 1px; animation: typing-bounce 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing-bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
/* INPUT */
.chat-input-area { padding: 8px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); flex-shrink: 0; position: relative; }
.input-toolbar { display: flex; gap: 4px; margin-bottom: 6px; }
.toolbar-btn { display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; color: var(--text3); transition: all 0.15s; background: var(--surface2); }
.toolbar-btn:hover { background: var(--surface3); color: var(--text); }
.chat-input-box { background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius); display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px; transition: border-color 0.2s; }
.chat-input-box:focus-within { border-color: var(--accent); }
#msg-input { flex: 1; font-size: 14px; color: var(--text); resize: none; line-height: 1.5; max-height: 100px; min-height: 22px; background: transparent; }
#msg-input::placeholder { color: var(--text3); }
.input-actions { display: flex; gap: 4px; align-items: flex-end; }
.emoji-btn { color: var(--text3); font-size: 18px; padding: 2px; border-radius: 6px; transition: all 0.15s; line-height: 1; }
.emoji-btn:hover { color: var(--text); }
.send-btn { width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.15s; flex-shrink: 0; }
.send-btn:hover { opacity: 0.9; transform: scale(1.05); } .send-btn:disabled { opacity: 0.4; transform: none; }
.emoji-picker { position: absolute; bottom: 70px; right: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; display: none; flex-wrap: wrap; gap: 3px; max-width: 260px; box-shadow: var(--shadow); z-index: 100; }
.emoji-picker.open { display: flex; }
.emoji-option { font-size: 20px; padding: 4px; border-radius: 6px; cursor: pointer; transition: background 0.1s; }
.emoji-option:hover { background: var(--surface2); }
/* RIGHT PANEL */
#right-panel { width: 280px; min-width: 280px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; transform: translateX(100%); transition: transform 0.3s; position: absolute; right: 0; top: 0; z-index: 50; }
#right-panel.open { transform: translateX(0); position: relative; }
.panel-header { padding: 14px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.panel-title { font-size: 15px; font-weight: 600; }
.panel-close { color: var(--text3); font-size: 18px; border-radius: 6px; padding: 2px 6px; }
.panel-close:hover { background: var(--surface2); color: var(--text); }
.panel-body { flex: 1; overflow-y: auto; padding: 10px; }
/* FRIENDS PANEL */
.friend-search-box { display: flex; gap: 6px; margin-bottom: 10px; }
.friend-search-box input { flex: 1; background: var(--surface2); border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 13px; color: var(--text); transition: border-color 0.2s; }
.friend-search-box input:focus { border-color: var(--accent); }
.add-friend-btn { background: var(--accent); color: #fff; border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; font-weight: 600; transition: opacity 0.15s; white-space: nowrap; }
.add-friend-btn:hover { opacity: 0.9; }
.friend-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--radius-sm); cursor: pointer; transition: background 0.1s; }
.friend-item:hover { background: var(--surface2); }
.friend-info { flex: 1; min-width: 0; }
.friend-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.friend-status { font-size: 11px; color: var(--text3); }
.friend-actions { display: flex; gap: 3px; }
.friend-btn { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.15s; }
.friend-btn.accept { background: rgba(74,222,128,0.15); color: #4ade80; }
.friend-btn.accept:hover { background: rgba(74,222,128,0.25); }
.friend-btn.reject, .friend-btn.remove { background: rgba(248,113,113,0.15); color: var(--danger); }
.friend-btn.reject:hover, .friend-btn.remove:hover { background: rgba(248,113,113,0.25); }
.friend-btn.dm { background: rgba(124,106,247,0.15); color: var(--accent); }
.friend-btn.dm:hover { background: rgba(124,106,247,0.25); }
.section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; padding: 8px 8px 4px; }
/* ONLINE PLAYERS PANEL */
.online-player-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: var(--radius-sm); transition: background 0.1s; }
.online-player-item:hover { background: var(--surface2); cursor: pointer; }
.online-player-name { font-size: 13px; font-weight: 500; flex: 1; }
.online-player-status { font-size: 11px; color: var(--text3); }
.add-from-online-btn { background: rgba(124,106,247,0.15); color: var(--accent); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; transition: all 0.15s; }
.add-from-online-btn:hover { background: rgba(124,106,247,0.3); }
.add-from-online-btn.sent { background: rgba(74,222,128,0.1); color: #4ade80; cursor: default; }
/* SETTINGS */
.settings-section { margin-bottom: 18px; }
.settings-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; color: var(--text3); text-transform: uppercase; margin-bottom: 8px; }
.color-grid { display: flex; gap: 6px; flex-wrap: wrap; }
.color-swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.15s; }
.color-swatch.selected { border-color: var(--text); transform: scale(1.15); }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); }
.settings-row:last-child { border-bottom: none; }
.settings-row-label { font-size: 13px; color: var(--text2); }
.status-options { display: flex; gap: 5px; flex-wrap: wrap; }
.status-opt { padding: 4px 9px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; background: var(--surface3); color: var(--text2); cursor: pointer; transition: all 0.15s; }
.status-opt[data-s="online"].active { background: rgba(74,222,128,0.2); color: #4ade80; }
.status-opt[data-s="away"].active { background: rgba(250,204,21,0.2); color: #facc15; }
.status-opt[data-s="dnd"].active { background: rgba(248,113,113,0.2); color: var(--danger); }
/* TOAST */
#toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--text); box-shadow: var(--shadow); animation: toast-in 0.3s ease; white-space: nowrap; }
.toast.success { border-color: rgba(74,222,128,0.4); color: #4ade80; }
.toast.error { border-color: rgba(248,113,113,0.4); color: var(--danger); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
/* MOBILE */
@media (max-width: 768px) {
  #sidebar { position: fixed; z-index: 60; left: 0; top: 0; width: 260px; height: 100dvh; transform: translateX(-100%); box-shadow: var(--shadow); }
  #sidebar.mobile-open { transform: translateX(0); }
  .menu-btn { display: flex !important; }
  #right-panel { position: fixed !important; bottom: 0 !important; left: 0 !important; right: 0 !important; top: auto !important; width: 100vw !important; min-width: unset !important; height: auto; max-height: 55dvh; border-radius: 20px 20px 0 0; border-left: none; border-top: 1px solid var(--border); transform: translateY(110%) !important; transition: transform 0.3s ease; z-index: 70; display: flex !important; flex-direction: column; overflow: hidden; }
  #right-panel.open { transform: translateY(0) !important; }
  #right-panel .panel-body { overflow-y: auto; }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 55; display: none; }
  .sidebar-overlay.active { display: block; }
  .input-toolbar { display: none; }
}
@media (max-width: 480px) { .auth-card { padding: 22px 18px; } }
@media (min-width: 769px) {
  #main-screen { position: relative; }
  #right-panel { position: relative !important; transform: none !important; display: none; height: 100dvh; max-height: 100dvh; }
  #right-panel.open { display: flex; }
}
/* MISC */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: var(--text3); gap: 8px; }
.empty-icon { font-size: 36px; }
.empty-text { font-size: 13px; }
.loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.notif-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); position: absolute; top: 2px; right: 2px; border: 2px solid var(--surface); display: none; }
.has-notif .notif-dot { display: block; }
/* USER POPUP */
.user-popup { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); z-index: 200; min-width: 210px; display: none; }
.user-popup.open { display: block; }
.user-popup-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.user-popup-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #fff; }
.user-popup-name { font-size: 15px; font-weight: 700; }
.user-popup-username { font-size: 12px; color: var(--text3); }
.user-popup-actions { display: flex; flex-direction: column; gap: 4px; }
.user-popup-btn { padding: 8px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; text-align: left; transition: background 0.1s; color: var(--text2); width: 100%; }
.user-popup-btn:hover { background: var(--surface2); color: var(--text); }
.user-popup-btn.danger { color: var(--danger); }
.user-popup-btn.danger:hover { background: rgba(248,113,113,0.1); }
.user-popup-game-menu { display: none; flex-direction: column; gap: 2px; padding: 2px 0 0 10px; }
.user-popup-game-menu.open { display: flex; }
.user-popup-game-opt { padding: 7px 12px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; text-align: left; transition: background 0.1s; color: var(--text2); display: flex; align-items: center; gap: 8px; width: 100%; }
.user-popup-game-opt:hover { background: var(--surface2); color: var(--text); }
/* GAME SCREEN */
#game-screen { position: fixed; inset: 0; z-index: 300; background: var(--bg); display: none; flex-direction: column; animation: fade-in 0.25s ease; }
#game-screen.active { display: flex; }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.game-screen-header { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
.game-screen-back { width: 34px; height: 34px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text2); transition: all 0.15s; }
.game-screen-back:hover { background: var(--surface2); color: var(--text); }
.game-screen-title { font-size: 16px; font-weight: 700; }
.game-screen-subtitle { font-size: 12px; color: var(--text3); }
.game-screen-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 24px 16px; gap: 16px; }
.game-waiting-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 24px; text-align: center; max-width: 360px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.game-waiting-icon { font-size: 48px; }

.game-waiting-spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
.game-cancel-btn { padding: 9px 20px; border-radius: var(--radius-sm); background: var(--surface2); border: 1px solid var(--border); font-size: 13px; font-weight: 600; color: var(--text2); transition: all 0.15s; }
.game-cancel-btn:hover { border-color: var(--danger); color: var(--danger); }
/* GAME REQUEST BANNER */
#game-request-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 400; background: linear-gradient(135deg, rgba(30,20,60,0.98), rgba(20,40,50,0.98)); border-bottom: 1px solid rgba(124,106,247,0.4); color: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.6); transform: translateY(-110%); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); }
#game-request-banner.show { transform: translateY(0); }
.banner-icon { font-size: 28px; flex-shrink: 0; }
.banner-info { flex: 1; min-width: 0; }
.banner-title { font-size: 14px; font-weight: 700; color: var(--text); }
.banner-sub { font-size: 12px; color: var(--text2); }
.banner-actions { display: flex; gap: 8px; flex-shrink: 0; }
.banner-btn { padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; transition: all 0.15s; }
.banner-btn.accept { background: var(--accent); color: #fff; }
.banner-btn.accept:hover { opacity: 0.9; transform: scale(1.03); }
.banner-btn.decline { background: var(--surface3); color: var(--text2); border: 1px solid var(--border); }
.banner-btn.decline:hover { border-color: var(--danger); color: var(--danger); }
/* NOTIFICATIONS PANEL */
.notif-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 8px; border-radius: var(--radius-sm); border-bottom: 1px solid var(--border); transition: background 0.1s; }
.notif-item:hover { background: var(--surface2); }
.notif-item:last-child { border-bottom: none; }
.notif-item.unread { background: rgba(124,106,247,0.06); }
.notif-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; color: #fff; }
.notif-content { flex: 1; min-width: 0; }
.notif-text { font-size: 13px; color: var(--text); line-height: 1.4; }
.notif-time { font-size: 11px; color: var(--text3); margin-top: 3px; }
.notif-actions { display: flex; gap: 5px; margin-top: 7px; }
.notif-btn { padding: 5px 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; transition: all 0.15s; }
.notif-btn.accept { background: rgba(124,106,247,0.15); color: var(--accent); border: 1px solid rgba(124,106,247,0.3); }
.notif-btn.accept:hover { background: rgba(124,106,247,0.3); }
.notif-btn.decline { background: var(--surface3); color: var(--text3); border: 1px solid var(--border); }
.notif-btn.decline:hover { border-color: var(--danger); color: var(--danger); }
/* GAME BOARDS */
.game-status-bar { font-size: 13px; font-weight: 600; padding: 8px 16px; background: var(--surface2); border-radius: var(--radius-sm); border: 1px solid var(--border); text-align: center; width: 100%; }
.game-status-bar.your-turn { border-color: var(--accent); color: var(--accent); background: rgba(124,106,247,0.1); }
.game-status-bar.won { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.1); }
.game-status-bar.lost { border-color: var(--danger); color: var(--danger); background: rgba(248,113,113,0.1); }
.game-status-bar.draw { border-color: #facc15; color: #facc15; background: rgba(250,204,21,0.1); }
.game-resign-btn { font-size: 12px; color: var(--text3); padding: 4px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); transition: all 0.15s; }
.game-resign-btn:hover { border-color: var(--danger); color: var(--danger); }
.c4-board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 14px; background: #1a2a6e; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,40,0.6); }
.c4-cell { width: 46px; height: 46px; border-radius: 50%; background: #0d0d10; cursor: pointer; transition: background 0.15s, transform 0.1s; position: relative; overflow: hidden; }
.c4-cell:hover { transform: scale(1.05); }
.c4-cell.p1 { background: #f87171; box-shadow: 0 0 10px rgba(248,113,113,0.5); }
.c4-cell.p2 { background: #facc15; box-shadow: 0 0 10px rgba(250,204,21,0.5); }
.c4-cell.win-cell { animation: c4-pulse 0.6s infinite alternate; }
@keyframes c4-pulse { from { transform: scale(1); } to { transform: scale(1.12); } }
.c4-legend { display: flex; gap: 16px; font-size: 12px; color: var(--text2); }
.c4-legend-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; vertical-align: middle; }
@media (max-width: 480px) { .c4-cell { width: 38px; height: 38px; } .c4-board { gap: 5px; padding: 10px; } }
.chess-board-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.chess-board { display: grid; grid-template-columns: repeat(8, 1fr); border: 2px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 32px rgba(0,0,0,0.6); }
.chess-square { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; position: relative; transition: background 0.1s; user-select: none; }
.chess-square.light { background: #f0d9b5; }
.chess-square.dark  { background: #b58863; }
.chess-square.selected { background: #7fc97f !important; }
.chess-square.valid-move { background: rgba(127,201,127,0.55) !important; }
.chess-square.valid-move::after { content: ''; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,0.2); position: absolute; }
.chess-square.last-move { background: rgba(255,210,80,0.55) !important; }
.chess-square.in-check { background: rgba(248,113,113,0.7) !important; }
.chess-rank-labels { display: flex; flex-direction: column-reverse; font-size: 10px; color: var(--text3); gap: 0; font-family: 'Space Mono', monospace; }
.chess-rank-labels span { height: 52px; display: flex; align-items: center; }
.chess-file-labels { display: flex; font-size: 10px; color: var(--text3); font-family: 'Space Mono', monospace; }
.chess-file-labels span { width: 52px; text-align: center; }
@media (max-width: 480px) { .chess-square { width: 40px; height: 40px; font-size: 24px; } .chess-rank-labels span { height: 40px; } .chess-file-labels span { width: 40px; } }
</style>
</head>
<body>
<div id="app">

<!-- AUTH -->
<div id="auth-screen" class="screen active">
  <div class="auth-logo">vibe.</div>
  <p class="auth-tagline">Real conversations, real people.</p>
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Create Account</button>
    </div>
    <div id="auth-error" class="auth-error"></div>
    <div class="field"><label>Username</label><input type="text" id="auth-username" placeholder="your_username" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
    <div class="field" id="display-name-field" style="display:none"><label>Display Name</label><input type="text" id="auth-displayname" placeholder="How others see you"></div>
    <div class="field"><label>Password</label><input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="auth-btn" id="auth-submit-btn" onclick="handleAuth()">Sign In</button>
  </div>
</div>

<!-- MAIN -->
<div id="main-screen" class="screen">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="logo-small">vibe.</span>
      <div class="header-actions">
        <button class="icon-btn" style="position:relative" onclick="openPanel('notifications')" title="Notifications">🔔<span class="notif-dot" id="notif-badge"></span></button>
        <button class="icon-btn" style="position:relative" onclick="openPanel('friends')" title="Friends">👥<span class="notif-dot" id="friend-notif"></span></button>
        <button class="icon-btn" onclick="openPanel('online')" title="Who's online">🌐</button>
        <button class="icon-btn" onclick="openPanel('settings')" title="Settings">⚙️</button>
      </div>
    </div>
    <div class="online-bar" onclick="openPanel('online')">
      <span class="online-dot"></span>
      <span id="online-count">0 online</span>
      <span style="margin-left:auto;font-size:10px;color:var(--text3)">view all →</span>
    </div>
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" id="stab-channels" onclick="switchSideTab('channels')">Channels</button>
      <button class="sidebar-tab" id="stab-dms" onclick="switchSideTab('dms')">DMs</button>
    </div>
    <div class="list-section" id="sidebar-list"></div>
    <div class="sidebar-footer">
      <div class="my-avatar" id="my-avatar">?</div>
      <div class="my-info">
        <div class="my-name" id="my-name">—</div>
        <div class="my-status" id="my-status-label">● Online</div>
      </div>
      <button class="icon-btn" onclick="logout()" title="Log out" style="color:var(--text3)">↩</button>
    </div>
  </div>
  <!-- Chat -->
  <div id="chat-area">
    <div class="chat-header">
      <button class="menu-btn icon-btn" onclick="toggleSidebar()">☰</button>
      <div class="chat-channel-info">
        <div class="chat-channel-name" id="chat-channel-name"># general</div>
        <div class="chat-channel-desc" id="chat-channel-desc">The main hangout</div>
      </div>
      <div class="chat-header-actions">
        <button class="icon-btn" style="position:relative" onclick="openPanel('notifications')" title="Notifications">🔔<span class="notif-dot" id="notif-badge2"></span></button>
        <button class="icon-btn" style="position:relative" onclick="openPanel('friends')" title="Friends">👥<span class="notif-dot" id="friend-notif2"></span></button>
        <button class="icon-btn" onclick="openPanel('online')" title="Online players">🌐</button>
      </div>
    </div>
    <div id="messages"><div class="empty-state"><div class="loading-spinner"></div></div></div>
    <div id="typing-bar"></div>
    <div class="chat-input-area">
      <div class="input-toolbar">
        <button class="toolbar-btn" onclick="toggleEmojiPicker(event)">😊 Emoji</button>
      </div>
      <div class="emoji-picker" id="emoji-picker"></div>
      <div class="chat-input-box">
        <textarea id="msg-input" placeholder="Message..." rows="1" oninput="autoResize(this); handleTyping()" onkeydown="handleInputKey(event)"></textarea>
        <div class="input-actions">
          <button class="emoji-btn" onclick="toggleEmojiPicker(event)">😊</button>
          <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>➤</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Right Panel -->
  <div id="right-panel">
    <div class="panel-header">
      <span class="panel-title" id="panel-title">Friends</span>
      <button class="panel-close icon-btn" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </div>
</div>
</div>

<!-- User popup -->
<div class="user-popup" id="user-popup">
  <div class="user-popup-header">
    <div class="user-popup-avatar" id="popup-avatar"></div>
    <div><div class="user-popup-name" id="popup-name"></div><div class="user-popup-username" id="popup-username"></div></div>
  </div>
  <div class="user-popup-actions" id="popup-actions"></div>
</div>

<!-- Game Request Banner -->
<div id="game-request-banner">
  <div class="banner-icon">🎮</div>
  <div class="banner-info">
    <div class="banner-title" id="banner-title">Someone wants to play!</div>
    <div class="banner-sub" id="banner-sub">Tap Accept to join</div>
  </div>
  <div class="banner-actions">
    <button class="banner-btn accept" onclick="acceptGameBanner()">Accept</button>
    <button class="banner-btn decline" onclick="declineGameBanner()">Decline</button>
  </div>
</div>

<!-- Full-Screen Game Screen -->
<div id="game-screen">
  <div class="game-screen-header">
    <button class="game-screen-back" onclick="leaveGameScreen()">←</button>
    <div>
      <div class="game-screen-title" id="gs-title">Chess</div>
      <div class="game-screen-subtitle" id="gs-subtitle">Waiting for opponent…</div>
    </div>
  </div>
  <div class="game-screen-body" id="gs-body"></div>
</div>

<div id="toast-container"></div>

<script>
const SUPABASE_URL = 'https://djsjmkxdcshwdcgjjqgl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqc2pta3hkY3Nod2RjZ2pqcWdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2Mzc4MjIsImV4cCI6MjA5NTIxMzgyMn0.MW41C3Nrf7kA85yOCFiyZilq-yC5gAVNajWT-xP4Ew0';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentChannel = { id: 'general', name: 'general', type: 'channel' };
let messagesSub = null, typingSub = null, presenceSub = null, gameNotifSub = null;
let typingTimeout = null, typingUsers = {}, onlineUsers = {}, onlineUserData = {};
let friendRequests = [], friends = [], unreadDMs = {};
let currentTab = 'channels', rightPanelMode = null;
let notifications = [];
let pendingBannerSession = null;

const CHANNELS = [
  { id: 'general', name: 'general', desc: 'The main hangout' },
  { id: 'random', name: 'random', desc: 'Anything goes' },
  { id: 'gaming', name: 'gaming', desc: 'Talk about games' },
  { id: 'music', name: 'music', desc: 'Share your playlists' },
  { id: 'tech', name: 'tech', desc: 'Tech talk' },
];
const EMOJIS = ['😀','😂','😍','🥰','😎','🤔','😢','😡','🥳','🎉','🔥','❤️','👍','👎','🙏','💯','✨','🎮','🎵','💻','🚀','🌙','⭐','🌈','🍕','☕','🧠','👀','💀','🤣'];
const USER_COLORS = ['#7c6af7','#f472b6','#5eead4','#fb923c','#a3e635','#38bdf8','#e879f9','#facc15'];
const GAME_INFO = {
  chess: { icon: '♟️', name: 'Chess', desc: 'Classic strategy game' },
  connect4: { icon: '🔴', name: 'Connect 4', desc: 'Get 4 in a row to win' }
};

// ===== AUTH =====
let authMode = 'login';
function switchTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-register').classList.toggle('active', mode === 'register');
  document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Sign In' : 'Create Account';
  document.getElementById('display-name-field').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('auth-error').style.display = 'none';
}
document.getElementById('auth-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
document.getElementById('auth-username').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });

async function handleAuth() {
  const username = document.getElementById('auth-username').value.trim().toLowerCase();
  const password = document.getElementById('auth-password').value;
  const displayName = document.getElementById('auth-displayname').value.trim();
  const btn = document.getElementById('auth-submit-btn');
  if (!username || !password) { showAuthError('Please fill in all fields.'); return; }
  if (username.length < 3) { showAuthError('Username must be at least 3 characters.'); return; }
  if (password.length < 4) { showAuthError('Password must be at least 4 characters.'); return; }
  if (authMode === 'register' && !displayName) { showAuthError('Please enter a display name.'); return; }
  btn.disabled = true;
  btn.textContent = authMode === 'login' ? 'Signing in…' : 'Creating account…';
  try {
    if (authMode === 'register') {
      const { data: existing } = await sb.from('users').select('id').eq('username', username).single();
      if (existing) { showAuthError('Username already taken.'); btn.disabled = false; btn.textContent = 'Create Account'; return; }
      const colorIndex = Math.floor(Math.random() * USER_COLORS.length);
      const { data, error } = await sb.from('users').insert({ username, display_name: displayName, password_hash: btoa(password), color_index: colorIndex, status: 'online' }).select().single();
      if (error) throw error;
      currentUser = data;
    } else {
      const { data, error } = await sb.from('users').select('*').eq('username', username).eq('password_hash', btoa(password)).single();
      if (error || !data) { showAuthError('Invalid username or password.'); btn.disabled = false; btn.textContent = 'Sign In'; return; }
      currentUser = data;
    }
    localStorage.setItem('vibe_user_id', currentUser.id);
    await sb.from('users').update({ status: 'online', last_seen: new Date().toISOString() }).eq('id', currentUser.id);
    enterApp();
  } catch (e) {
    showAuthError(e.message || 'Something went wrong.');
    btn.disabled = false; btn.textContent = authMode === 'login' ? 'Sign In' : 'Create Account';
  }
}
function showAuthError(msg) { const el = document.getElementById('auth-error'); el.textContent = msg; el.style.display = 'block'; }
async function tryAutoLogin() {
  const uid = localStorage.getItem('vibe_user_id');
  if (!uid) return;
  const { data } = await sb.from('users').select('*').eq('id', uid).single();
  if (data) { currentUser = data; enterApp(); }
}

// ===== ENTER APP =====
async function enterApp() {
  document.getElementById('auth-screen').classList.remove('active');
  document.getElementById('main-screen').classList.add('active');
  const initials = currentUser.display_name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('my-avatar').textContent = initials;
  document.getElementById('my-avatar').style.background = USER_COLORS[currentUser.color_index] || '#7c6af7';
  document.getElementById('my-name').textContent = currentUser.display_name;
  const savedAccent = localStorage.getItem('vibe_accent');
  if (savedAccent) document.documentElement.style.setProperty('--accent', savedAccent);
  setupEmojiPicker();
  renderSidebarList();
  await loadFriends();
  setupPresence();
  loadNotificationsFromStorage();
  subscribeToGameNotifications();
  switchToChannel(CHANNELS[0]);
}
async function logout() {
  if (currentUser) await sb.from('users').update({ status: 'offline', last_seen: new Date().toISOString() }).eq('id', currentUser.id);
  localStorage.removeItem('vibe_user_id');
  location.reload();
}

// ===== SIDEBAR =====
function renderSidebarList() {
  const el = document.getElementById('sidebar-list');
  el.innerHTML = '';
  if (currentTab === 'channels') {
    el.innerHTML = `<div class="list-label">Channels</div>`;
    CHANNELS.forEach(ch => {
      const div = document.createElement('div');
      div.className = 'channel-item' + (currentChannel.id === ch.id ? ' active' : '');
      div.innerHTML = `<span class="channel-hash">#</span><span class="channel-name">${ch.name}</span>`;
      div.onclick = () => switchToChannel(ch);
      el.appendChild(div);
    });
  } else {
    el.innerHTML = `<div class="list-label">Direct Messages</div>`;
    if (friends.length === 0) { el.innerHTML += `<div style="padding:14px 8px;color:var(--text3);font-size:13px">Add friends to start DMs!</div>`; }
    friends.forEach(f => {
      const dmId = getDMId(currentUser.id, f.id);
      const isActive = currentChannel.type === 'dm' && currentChannel.id === dmId;
      const isOnline = !!onlineUsers[f.id];
      const initials = f.display_name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      const div = document.createElement('div');
      div.className = 'dm-item' + (isActive ? ' active' : '');
      const unread = unreadDMs[dmId] ? `<span class="unread-badge">${unreadDMs[dmId]}</span>` : '';
      div.innerHTML = `
        <div class="dm-avatar" style="background:${USER_COLORS[f.color_index]||'#7c6af7'};color:#fff">
          ${initials}${isOnline ? '<span class="status-ring"></span>' : ''}
        </div>
        <span class="dm-name">${f.display_name}</span>${unread}`;
      div.onclick = () => switchToDM(f);
      el.appendChild(div);
    });
  }
}
function switchSideTab(tab) {
  currentTab = tab;
  document.getElementById('stab-channels').classList.toggle('active', tab === 'channels');
  document.getElementById('stab-dms').classList.toggle('active', tab === 'dms');
  renderSidebarList();
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('mobile-open'); document.getElementById('sidebar-overlay').classList.toggle('active'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('mobile-open'); document.getElementById('sidebar-overlay').classList.remove('active'); }

// ===== CHANNELS / DMS =====
async function switchToChannel(ch) {
  currentChannel = { id: ch.id, name: ch.name, type: 'channel', desc: ch.desc };
  document.getElementById('chat-channel-name').textContent = `# ${ch.name}`;
  document.getElementById('chat-channel-desc').textContent = ch.desc;
  renderSidebarList(); closeSidebar();
  await loadMessages(); subscribeToMessages(); subscribeToTyping();
}
async function switchToDM(friend) {
  const dmId = getDMId(currentUser.id, friend.id);
  currentChannel = { id: dmId, name: friend.display_name, type: 'dm', friendId: friend.id };
  document.getElementById('chat-channel-name').textContent = `💬 ${friend.display_name}`;
  document.getElementById('chat-channel-desc').textContent = 'Direct message';
  delete unreadDMs[dmId];
  renderSidebarList(); closeSidebar(); closePanel();
  await loadMessages(); subscribeToMessages(); subscribeToTyping();
}
function getDMId(a, b) { return [a, b].sort().join('__dm__'); }

// ===== MESSAGES =====
async function loadMessages() {
  document.getElementById('messages').innerHTML = `<div class="empty-state"><div class="loading-spinner"></div></div>`;
  const { data, error } = await sb.from('messages').select('*, users(id,display_name,color_index,username)').eq('channel_id', currentChannel.id).order('created_at', { ascending: true }).limit(100);
  if (error) { document.getElementById('messages').innerHTML = `<div class="empty-state"><span class="empty-icon">⚠️</span><span class="empty-text">Could not load messages</span></div>`; return; }
  renderMessages(data || []);
}

function renderMessages(msgs) {
  const container = document.getElementById('messages');
  if (!msgs || msgs.length === 0) { container.innerHTML = `<div class="empty-state"><span class="empty-icon">💬</span><span class="empty-text">No messages yet. Say hi!</span></div>`; return; }
  container.innerHTML = '';
  let lastAuthor = null, lastDate = null;
  msgs.forEach(msg => {
    const date = new Date(msg.created_at);
    const dateStr = date.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    if (dateStr !== lastDate) {
      const div = document.createElement('div'); div.className = 'msg-date-divider'; div.textContent = dateStr;
      container.appendChild(div); lastDate = dateStr; lastAuthor = null;
    }
    const sameAuthor = lastAuthor === msg.user_id;
    const msgEl = buildMessageEl(msg, sameAuthor);
    if (msg.id) msgEl.dataset.msgId = msg.id;
    container.appendChild(msgEl);
    lastAuthor = msg.user_id;
  });
  container.scrollTop = container.scrollHeight;
}

function buildMessageEl(msg, sameAuthor) {
  const isOwn = msg.user_id === currentUser?.id;
  const user = msg.users || {};
  const displayName = user.display_name || 'Unknown';
  const colorIdx = user.color_index ?? 0;
  const color = USER_COLORS[colorIdx] || '#7c6af7';
  const initials = displayName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const date = new Date(msg.created_at);
  const timeStr = date.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  const row = document.createElement('div');
  row.className = 'msg-row';
  const bubbleContent = `<div class="msg-bubble">${escHTML(msg.content)}</div>`;
  const avatarHtml = `<div class="msg-avatar${sameAuthor?' hidden':''}" style="background:${color};color:#fff" onclick="showUserPopup(event,${JSON.stringify(user).replace(/"/g,'&quot;')})">${initials}</div>`;
  const headerHtml = sameAuthor ? '' : `<div class="msg-header"><span class="msg-author" style="color:${color}" onclick="showUserPopup(event,${JSON.stringify(user).replace(/"/g,'&quot;')})">${escHTML(displayName)}</span><span class="msg-time">${timeStr}</span></div>`;
  row.innerHTML = `${avatarHtml}<div class="msg-content">${headerHtml}${bubbleContent}</div>`;
  return row;
}

function subscribeToMessages() {
  messagesSub && sb.removeChannel(messagesSub);
  messagesSub = sb.channel(`msgs:${currentChannel.id}`)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `channel_id=eq.${currentChannel.id}` }, async payload => {
      const msg = payload.new;
      const { data: ud } = await sb.from('users').select('id,display_name,color_index,username').eq('id', msg.user_id).single();
      msg.users = ud;
      const container = document.getElementById('messages');
      if (container.querySelector('.empty-state')) container.innerHTML = '';
      const lastRow = container.lastElementChild;
      const lastAuthorId = lastRow?.dataset?.authorId;
      const sameAuthor = lastAuthorId == msg.user_id;
      const el = buildMessageEl(msg, sameAuthor);
      el.dataset.authorId = msg.user_id;
      el.dataset.msgId = msg.id;
      container.appendChild(el);
      const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 150;
      if (nearBottom || msg.user_id === currentUser?.id) container.scrollTop = container.scrollHeight;
    }).subscribe();
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const content = input.value.trim();
  if (!content || !currentUser) return;
  input.value = ''; autoResize(input);
  document.getElementById('send-btn').disabled = true;
  await sb.from('messages').insert({ channel_id: currentChannel.id, user_id: currentUser.id, content });
  await sb.from('typing').delete().eq('channel_id', currentChannel.id).eq('user_id', currentUser.id);
}

// ===== GAME REQUEST =====
async function requestGame(targetUser, gameType) {
  if (!currentUser || !targetUser) return;
  closeUserPopup();
  const gi = GAME_INFO[gameType];
  if (!gi) return;

  // We use the DM ID as the channel_id to keep it private
  const dmId = getDMId(currentUser.id, targetUser.id);
  const initialState = gameType === 'chess' 
    ? { board: initChessBoard(), turn: 'w', captured: {w:[],b:[]}, lastMove: null }
    : { board: initC4Board(), turn: 1 };

  // Matching your original working vibe-2.html structure exactly
  const { data: session, error } = await sb.from('game_sessions').insert({
    type: gameType,
    channel_id: dmId,
    challenger_id: currentUser.id,
    status: 'waiting',
    state: JSON.stringify(initialState)
  }).select().single();

  if (error || !session) {
    console.error('Game Error:', error);
    if (error?.message?.includes("Could not find the table 'public.game_sessions'")) {
      alert("Database Setup Needed: The 'game_sessions' table is missing from your Supabase project. \n\nPlease run the SQL script provided by Manus in your Supabase SQL Editor to enable games and notifications!");
    } else {
      alert('Game Error: ' + (error?.message || 'Unknown error'));
    }
    toast('Could not create game session.', 'error');
    return;
  }

  const sid = session.id;

  // Send a notification message in the DM so they see it there too (matching vibe-2 style)
  const payload = { type: gameType, sessionId: sid, challengerName: currentUser.display_name };
  await sb.from('messages').insert({ 
    channel_id: dmId, 
    user_id: currentUser.id, 
    content: '__GAME__:' + JSON.stringify(payload) 
  });

  // Try to send the real-time notification banner data
  try {
    await sb.from('game_notifications').insert({
      session_id: sid,
      challenger_id: currentUser.id,
      opponent_id: targetUser.id,
      game_type: gameType,
      status: 'pending'
    });
  } catch(e) {
    console.warn('Real-time notification banner failed (table missing), but game is created.');
  }

  toast(`${gi.name} request sent!`, 'success');
  
  // Add a local notification for the challenger so they can rejoin later
  const notif = {
    id: 'challenger_' + sid,
    type: 'game_request',
    fromUser: targetUser, // Show who you challenged
    isOutgoing: true,
    gameType: gameType,
    sessionId: sid,
    timestamp: new Date().toISOString(),
    expiresAt: Date.now() + (5 * 60 * 1000),
    read: true
  };
  notifications.unshift(notif);
  saveNotificationsToStorage();

  openGameScreen(sid, gameType, true, targetUser.display_name);
}

// ===== GAME SCREEN =====
let activeGameScreenSid = null;
let activeGameScreenSub = null;
const screenGame = {};

function openGameScreen(sid, gameType, isChallenger, opponentName) {
  activeGameScreenSid = sid;
  const gi = GAME_INFO[gameType] || {};
  document.getElementById('gs-title').textContent = `${gi.icon || '🎮'} ${gi.name || 'Game'}`;
  document.getElementById('gs-subtitle').textContent = isChallenger
    ? `Waiting for ${opponentName || 'opponent'}…`
    : `vs ${opponentName || 'opponent'}`;
  document.getElementById('game-screen').classList.add('active');

  screenGame.sid = sid;
  screenGame.type = gameType;
  screenGame.isChallenger = isChallenger;
  screenGame.opponentName = opponentName || 'Opponent';
  screenGame.c4Board = initC4Board();
  screenGame.c4Turn = 1;
  screenGame.c4GameOver = false;
  screenGame.c4MyPiece = isChallenger ? 1 : 2;
  screenGame.chessBoard = initChessBoard();
  screenGame.chessTurn = 'w';
  screenGame.chessSelected = null;
  screenGame.chessValidMoves = [];
  screenGame.chessLastMove = null;
  screenGame.chessCaptured = {w:[],b:[]};
  screenGame.chessGameOver = false;
  screenGame.chessPlayerColor = isChallenger ? 'w' : 'b';

  // Always load and render the board immediately
  loadAndRenderGameScreen();

  if (activeGameScreenSub) sb.removeChannel(activeGameScreenSub);
  activeGameScreenSub = sb.channel('gs-realtime-' + sid)
    .on('postgres_changes', { 
      event: '*', 
      schema: 'public', 
      table: 'game_sessions', 
      filter: `id=eq.${sid}` 
    }, payload => {
      const data = payload.new;
      if (!data || !data.state) return;
      
      const s = typeof data.state === 'string' ? JSON.parse(data.state) : data.state;
      
      // Update status subtitle
      if (data.status === 'active') {
        document.getElementById('gs-subtitle').textContent = `vs ${screenGame.opponentName}`;
      } else if (data.status === 'finished') {
        document.getElementById('gs-subtitle').textContent = 'Game Over';
      }
      
      // Update local state and re-render
      if (gameType === 'connect4') {
        screenGame.c4Board = s.board || initC4Board();
        screenGame.c4Turn = s.turn || 1;
        screenGame.c4GameOver = data.status === 'finished';
        renderScreenC4(s.winner, s.winCells);
      } else {
        screenGame.chessBoard = s.board || initChessBoard();
        screenGame.chessTurn = s.turn || 'w';
        screenGame.chessLastMove = s.lastMove || null;
        screenGame.chessCaptured = s.captured || {w:[],b:[]};
        screenGame.chessGameOver = data.status === 'finished';
        screenGame.chessSelected = null; 
        screenGame.chessValidMoves = [];
        renderScreenChess(s.checkColor, s.winner);
      }
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') console.log('Game sync active for session:', sid);
    });
}

async function loadAndRenderGameScreen() {
  const { data } = await sb.from('game_sessions').select('*').eq('id', screenGame.sid).single();
  if (data && data.state) {
    try {
      const s = JSON.parse(data.state);
      if (screenGame.type === 'connect4') {
        screenGame.c4Board = s.board || initC4Board();
        screenGame.c4Turn = s.turn || 1;
        screenGame.c4GameOver = data.status === 'finished';
        renderScreenC4(s.winner, s.winCells);
      } else {
        screenGame.chessBoard = s.board || initChessBoard();
        screenGame.chessTurn = s.turn || 'w';
        screenGame.chessLastMove = s.lastMove || null;
        screenGame.chessCaptured = s.captured || {w:[],b:[]};
        screenGame.chessGameOver = data.status === 'finished';
        renderScreenChess(s.checkColor, s.winner);
      }
    } catch(e) { if (screenGame.type === 'connect4') renderScreenC4(); else renderScreenChess(); }
  } else {
    if (screenGame.type === 'connect4') renderScreenC4(); else renderScreenChess();
  }
}

function renderGameScreenWaiting() {
  const body = document.getElementById('gs-body');
  body.innerHTML = `
    <div class="game-waiting-card">
      <div class="game-waiting-icon">${GAME_INFO[screenGame.type]?.icon || '🎮'}</div>
      <div class="game-waiting-title">Waiting for ${escHTML(screenGame.opponentName)}…</div>
      <div class="game-waiting-sub">Your game request has been sent.<br>The board will appear as soon as they join.</div>
      <div class="game-waiting-spinner"></div>
      <button class="game-cancel-btn" onclick="cancelGameRequest()">Cancel Request</button>
    </div>`;
}

async function cancelGameRequest() {
  if (activeGameScreenSid) {
    try { await sb.from('game_sessions').update({ status: 'finished' }).eq('id', activeGameScreenSid); } catch(e) {}
    try { await sb.from('game_notifications').update({ status: 'declined' }).eq('session_id', activeGameScreenSid); } catch(e) {}
  }
  leaveGameScreen();
  toast('Game request cancelled.');
}

function leaveGameScreen() {
  document.getElementById('game-screen').classList.remove('active');
  if (activeGameScreenSub) { sb.removeChannel(activeGameScreenSub); activeGameScreenSub = null; }
  activeGameScreenSid = null;
}

// ---- Screen Connect 4 ----
function renderScreenC4(winner, winCells, isDraw) {
  const body = document.getElementById('gs-body');
  const myTurn = !screenGame.c4GameOver && screenGame.c4Turn === screenGame.c4MyPiece;
  let statusText = '', statusClass = '';
  if (screenGame.c4GameOver || winner) {
    if (isDraw) { statusText = "It's a draw! 🤝"; statusClass = 'draw'; }
    else if (winner === screenGame.c4MyPiece) { statusText = '🎉 You win!'; statusClass = 'won'; }
    else { statusText = '😞 You lost.'; statusClass = 'lost'; }
  } else {
    statusText = myTurn ? '🟢 Your turn — click a column' : `⏳ ${escHTML(screenGame.opponentName)}'s turn…`;
    statusClass = myTurn ? 'your-turn' : '';
  }
  const winSet = new Set((winCells || []).map(([r,c]) => `${r},${c}`));
  let html = `<div class="game-status-bar ${statusClass}" style="max-width:380px;width:100%">${statusText}</div><div class="c4-board">`;
  for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) {
    const val = screenGame.c4Board[r][c];
    const cls = val === 1 ? 'p1' : val === 2 ? 'p2' : '';
    const wc = winSet.has(`${r},${c}`) ? ' win-cell' : '';
    const click = !screenGame.c4GameOver && screenGame.c4Turn === screenGame.c4MyPiece && val === 0
      ? `onclick="screenC4Drop(${c})"` : '';
    html += `<div class="c4-cell ${cls}${wc}" ${click}></div>`;
  }
  html += `</div><div class="c4-legend">
    <span><span class="c4-legend-dot" style="background:#f87171"></span>${screenGame.c4MyPiece===1?'You':'Opp'} (Red)</span>
    <span><span class="c4-legend-dot" style="background:#facc15"></span>${screenGame.c4MyPiece===2?'You':'Opp'} (Yellow)</span>
  </div>`;
  if (!screenGame.c4GameOver) {
    html += `<button class="game-resign-btn" onclick="screenResign()">🏳 Resign</button>`;
  } else {
    html += `<button class="banner-btn accept" style="margin-top:10px" onclick="screenRematch()">🔄 Rematch</button>`;
  }
  body.innerHTML = html;
}

async function screenC4Drop(col) {
  if (screenGame.c4GameOver) return;
  if (screenGame.c4Turn !== screenGame.c4MyPiece) { toast("Not your turn!", 'error'); return; }
  let row = -1;
  for (let r = 5; r >= 0; r--) { if (screenGame.c4Board[r][col] === 0) { row = r; break; } }
  if (row === -1) return;
  screenGame.c4Board[row][col] = screenGame.c4MyPiece;
  const { winner, winCells } = checkC4Win(screenGame.c4Board, row, col, screenGame.c4MyPiece);
  const isDraw = !winner && screenGame.c4Board[0].every(c => c !== 0);
  screenGame.c4Turn = screenGame.c4Turn === 1 ? 2 : 1;
  if (winner) screenGame.c4GameOver = true;
  await sb.from('game_sessions').update({
    state: JSON.stringify({ board: screenGame.c4Board, turn: screenGame.c4Turn, winner, winCells }),
    status: (winner || isDraw) ? 'finished' : 'active'
  }).eq('id', screenGame.sid);
  renderScreenC4(winner, winCells, isDraw);
}

// ---- Screen Chess ----
function renderScreenChess(checkColor, winner, stalemate) {
  const body = document.getElementById('gs-body');
  const myTurn = !screenGame.chessGameOver && screenGame.chessTurn === screenGame.chessPlayerColor;
  let statusText = '', statusClass = '';
  if (screenGame.chessGameOver || winner) {
    if (stalemate) { statusText = 'Stalemate! 🤝 Draw'; statusClass = 'draw'; }
    else if (winner === screenGame.chessPlayerColor) { statusText = '♔ Checkmate! You win! 🎉'; statusClass = 'won'; }
    else { statusText = '♔ Checkmate! You lost.'; statusClass = 'lost'; }
  } else if (checkColor) {
    statusText = checkColor === screenGame.chessPlayerColor ? '⚠️ You are in check!' : '⚠️ Opponent in check!';
    statusClass = checkColor === screenGame.chessPlayerColor ? 'lost' : 'your-turn';
  } else {
    statusText = myTurn ? '♟️ Your turn' : `⏳ ${escHTML(screenGame.opponentName)}'s turn…`;
    statusClass = myTurn ? 'your-turn' : '';
  }
  const validSet = new Set((screenGame.chessValidMoves || []).map(([r,c]) => `${r},${c}`));
  const lastSet = screenGame.chessLastMove ? new Set([`${screenGame.chessLastMove[0]},${screenGame.chessLastMove[1]}`,`${screenGame.chessLastMove[2]},${screenGame.chessLastMove[3]}`]) : new Set();
  const flipped = screenGame.chessPlayerColor === 'b';
  const rows = flipped ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
  const cols = flipped ? [7,6,5,4,3,2,1,0] : [0,1,2,3,4,5,6,7];
  const files = ['a','b','c','d','e','f','g','h'];
  const oppColor = screenGame.chessPlayerColor === 'w' ? 'b' : 'w';
  const myCap = (screenGame.chessCaptured[screenGame.chessPlayerColor] || []).map(p => CHESS_PIECES[p] || '').join('');
  const oppCap = (screenGame.chessCaptured[oppColor] || []).map(p => CHESS_PIECES[p] || '').join('');
  let html = `<div class="game-status-bar ${statusClass}" style="max-width:480px;width:100%">${statusText}</div>`;
  html += `<div style="width:100%;max-width:480px;font-size:11px;color:var(--text3);display:flex;justify-content:space-between">
    <span>You captured: <span style="font-size:14px">${oppCap||'—'}</span></span>
    <span>They captured: <span style="font-size:14px">${myCap||'—'}</span></span></div>`;
  html += `<div class="chess-board-wrap"><div style="display:flex;align-items:center;gap:2px">
    <div class="chess-rank-labels">${rows.map(r=>`<span>${r+1}</span>`).join('')}</div>
    <div class="chess-board">`;
  for (const r of rows) for (const c of cols) {
    const isLight = (r+c)%2===0;
    const piece = screenGame.chessBoard[r][c];
    const isSel = screenGame.chessSelected && screenGame.chessSelected[0]===r && screenGame.chessSelected[1]===c;
    const isValid = validSet.has(`${r},${c}`);
    const isLast = lastSet.has(`${r},${c}`);
    const inCheck = checkColor && piece===checkColor+'K';
    let cls = isLight?'light':'dark';
    if(isSel) cls='selected';
    else if(isValid) cls='valid-move';
    else if(isLast) cls='last-move';
    if(inCheck) cls='in-check';
    const ph = piece ? `<span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))">${CHESS_PIECES[piece]||''}</span>` : '';
    html += `<div class="chess-square ${cls}" onclick="screenChessClick(${r},${c})">${ph}</div>`;
  }
  html += `</div></div><div class="chess-file-labels">${cols.map(c=>`<span>${files[c]}</span>`).join('')}</div></div>`;
  if (!screenGame.chessGameOver) {
    html += `<button class="game-resign-btn" onclick="screenResign()">🏳 Resign</button>`;
  } else {
    html += `<button class="banner-btn accept" style="margin-top:10px" onclick="screenRematch()">🔄 Rematch</button>`;
  }
  body.innerHTML = html;
}

function screenChessClick(row, col) {
  if (screenGame.chessGameOver) return;
  if (screenGame.chessTurn !== screenGame.chessPlayerColor) { toast("Not your turn!", 'error'); return; }
  const piece = screenGame.chessBoard[row][col];
  if (screenGame.chessSelected) {
    const isValid = (screenGame.chessValidMoves||[]).some(([r,c])=>r===row&&c===col);
    if (isValid) { screenChessDoMove(screenGame.chessSelected[0],screenGame.chessSelected[1],row,col); screenGame.chessSelected=null; screenGame.chessValidMoves=[]; return; }
    if (piece && piece[0]===screenGame.chessPlayerColor) { screenGame.chessSelected=[row,col]; screenGame.chessValidMoves=getChessMoves(screenGame.chessBoard,row,col,screenGame.chessTurn,screenGame); renderScreenChess(); return; }
    screenGame.chessSelected=null; screenGame.chessValidMoves=[]; renderScreenChess(); return;
  }
  if (piece && piece[0]===screenGame.chessPlayerColor) { screenGame.chessSelected=[row,col]; screenGame.chessValidMoves=getChessMoves(screenGame.chessBoard,row,col,screenGame.chessTurn,screenGame); renderScreenChess(); }
}

async function screenChessDoMove(fr,fc,tr,tc) {
  const piece=screenGame.chessBoard[fr][fc];
  const captured=screenGame.chessBoard[tr][tc];
  if(captured) screenGame.chessCaptured[screenGame.chessPlayerColor].push(captured);
  let movePiece=piece;
  if(piece==='wP'&&tr===0) movePiece='wQ';
  if(piece==='bP'&&tr===7) movePiece='bQ';
  screenGame.chessBoard[tr][tc]=movePiece; screenGame.chessBoard[fr][fc]=null;
  screenGame.chessLastMove=[fr,fc,tr,tc];
  const nextTurn=screenGame.chessTurn==='w'?'b':'w';
  const checkColor=isInCheck(screenGame.chessBoard,nextTurn)?nextTurn:null;
  const isCheckmate=checkColor&&!hasLegalMoves(screenGame.chessBoard,nextTurn,screenGame);
  const isStalemate=!checkColor&&!hasLegalMoves(screenGame.chessBoard,nextTurn,screenGame);
  screenGame.chessTurn=nextTurn;
  if(isCheckmate||isStalemate) screenGame.chessGameOver=true;
  const newState={board:screenGame.chessBoard,turn:screenGame.chessTurn,lastMove:screenGame.chessLastMove,captured:screenGame.chessCaptured,checkColor,winner:isCheckmate?screenGame.chessPlayerColor:null};
  await sb.from('game_sessions').update({state:JSON.stringify(newState),status:(isCheckmate||isStalemate)?'finished':'active'}).eq('id',screenGame.sid);
  screenGame.chessSelected=null; screenGame.chessValidMoves=[];
  renderScreenChess(checkColor,isCheckmate?screenGame.chessPlayerColor:null,isStalemate);
}

async function screenResign() {
  screenGame.c4GameOver=true; screenGame.chessGameOver=true;
  await sb.from('game_sessions').update({status:'finished',state:JSON.stringify({resigned:true,resignedBy:currentUser.id})}).eq('id',screenGame.sid);
  toast('You resigned.');
  if (screenGame.type === 'connect4') renderScreenC4(null, null, false);
  else renderScreenChess(null, null, false);
}

async function screenRematch() {
  const { data } = await sb.from('game_sessions').select('challenger_id, opponent_id').eq('id', screenGame.sid).single();
  if (!data) return;
  const targetId = data.challenger_id === currentUser.id ? data.opponent_id : data.challenger_id;
  const { data: targetUser } = await sb.from('users').select('*').eq('id', targetId).single();
  if (targetUser) {
    requestGame(targetUser, screenGame.type);
  }
}

// ===== GAME NOTIFICATIONS =====
function subscribeToGameNotifications() {
  if (!currentUser) return;
  if (gameNotifSub) sb.removeChannel(gameNotifSub);
  gameNotifSub = sb.channel('game-notifs:' + currentUser.id)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'game_notifications',
      filter: `opponent_id=eq.${currentUser.id}`
    }, async payload => {
      const n = payload.new;
      if (n.status !== 'pending') return;
      const { data: challenger } = await sb.from('users').select('id,display_name,color_index,username').eq('id', n.challenger_id).single();
      if (!challenger) return;
      const gi = GAME_INFO[n.game_type] || {};
      const notif = {
        id: n.id || Date.now(),
        type: 'game_request',
        fromUser: challenger,
        gameType: n.game_type,
        sessionId: n.session_id,
        timestamp: new Date().toISOString(),
        expiresAt: Date.now() + (5 * 60 * 1000), // 5 minutes from now
        read: false
      };
      notifications.unshift(notif);
      saveNotificationsToStorage();
      updateNotifBadge();
      if (rightPanelMode === 'notifications') renderNotificationsPanel();
      showGameRequestBanner(challenger, gi, n.session_id, n.game_type);
    }).subscribe();
}

function showGameRequestBanner(challenger, gi, sessionId, gameTypeKey) {

async function acceptGameBanner() {
  document.getElementById('game-request-banner').classList.remove('show');

  if (!pendingBannerSession) return;
  const { sessionId, challenger, gameTypeKey } = pendingBannerSession;

function declineGameBanner() {
  document.getElementById('game-request-banner').classList.remove('show');
  clearTimeout(window._bannerTimeout);
  if (!pendingBannerSession) return;
  const { sessionId } = pendingBannerSession;
  pendingBannerSession = null;
  try { sb.from('game_notifications').update({ status: 'declined' }).eq('session_id', sessionId); } catch(e) {}
  try { sb.from('game_sessions').update({ status: 'finished' }).eq('id', sessionId); } catch(e) {}
  const n = notifications.find(n => String(n.sessionId) === String(sessionId));

}

// ===== NOTIFICATIONS STORAGE =====
function saveNotificationsToStorage() {
  if (!currentUser) return;
  localStorage.setItem('vibe_notifs_' + currentUser.id, JSON.stringify(notifications.slice(0,50)));
}
function loadNotificationsFromStorage() {
  if (!currentUser) return;
  try { const s = localStorage.getItem('vibe_notifs_' + currentUser.id); if (s) notifications = JSON.parse(s); } catch(e) { notifications = []; }
  updateNotifBadge();
}
function updateNotifBadge() {
  const unread = notifications.filter(n => !n.read).length;
  const show = unread > 0;
  document.getElementById('notif-badge').style.display = show ? 'block' : 'none';
  document.getElementById('notif-badge2').style.display = show ? 'block' : 'none';
}

// ===== NOTIFICATIONS PANEL =====
function renderNotificationsPanel() {
  const body = document.getElementById('panel-body');
  
  // Filter out expired game requests
  const now = Date.now();
  const activeNotifs = notifications.filter(n => !n.expiresAt || n.expiresAt > now || n.accepted || n.declined);
  
  if (activeNotifs.length === 0) {
    body.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--text3);font-size:13px">No notifications yet.<br>Game requests will appear here!</div>`;
    return;
  }

  notifications.forEach(n => n.read = true);
  saveNotificationsToStorage();
  updateNotifBadge();
  
  body.innerHTML = '';
  activeNotifs.forEach(n => {
    const color = USER_COLORS[n.fromUser?.color_index] || '#7c6af7';
    const initials = (n.fromUser?.display_name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const gi = GAME_INFO[n.gameType] || {};
    const timeAgo = formatTimeAgo(n.timestamp);
    
    let actionsHtml = '';
    let timerHtml = '';
    
    if (n.type === 'game_request') {
      const fuJson = JSON.stringify(n.fromUser).replace(/"/g,'&quot;');
      const isExpired = n.expiresAt && n.expiresAt < now;
      
      if (n.isOutgoing) {
        // Outgoing challenge
        const status = n.accepted ? '✓ Accepted' : n.declined ? 'Declined' : isExpired ? 'Expired' : 'Waiting...';
        const statusColor = n.accepted ? '#4ade80' : 'var(--text3)';
        
        actionsHtml = `<div class="notif-actions">
          <button class="notif-btn accept" onclick="rejoinGame('${n.sessionId}','${n.gameType}',${fuJson})">📺 View Board</button>
          <div style="font-size:11px;color:${statusColor};margin-left:auto;align-self:center">${status}</div>
        </div>`;
        
        body.innerHTML += `
          <div class="notif-item">
            <div class="notif-avatar" style="background:${color}">${initials}</div>
            <div class="notif-content">
              <div class="notif-text">You challenged <b>${escHTML(n.fromUser?.display_name)}</b> to <b>${escHTML(gi.name||n.gameType)}</b> ${gi.icon||'🎮'}</div>
              <div class="notif-time">${timeAgo}</div>
              ${actionsHtml}
            </div>
          </div>`;
      } else {
        // Incoming challenge
        if (!n.accepted && !n.declined && !isExpired) {
          const timeLeft = Math.max(0, Math.floor((n.expiresAt - now) / 1000));
          const mins = Math.floor(timeLeft / 60);
          const secs = timeLeft % 60;
          timerHtml = `<span style="color:var(--accent);font-weight:700;margin-left:8px">⏱ ${mins}:${secs < 10 ? '0' : ''}${secs}</span>`;
          
          actionsHtml = `<div class="notif-actions">
            <button class="notif-btn accept" onclick="acceptNotifGame('${n.sessionId}','${n.gameType}',${fuJson})">▶ Join Game</button>
            <button class="notif-btn decline" onclick="declineNotifGame('${n.sessionId}')">Decline</button>
          </div>`;
        } else {
          const status = n.accepted ? '✓ Accepted' : n.declined ? 'Declined' : 'Expired';
          const statusColor = n.accepted ? '#4ade80' : 'var(--text3)';
          actionsHtml = `<div class="notif-actions">
            <button class="notif-btn accept" onclick="rejoinGame('${n.sessionId}','${n.gameType}',${fuJson})">📺 Rejoin</button>
            <div style="font-size:11px;color:${statusColor};margin-left:auto;align-self:center">${status}</div>
          </div>`;
        }
        
        body.innerHTML += `
          <div class="notif-item">
            <div class="notif-avatar" style="background:${color}">${initials}</div>
            <div class="notif-content">
              <div class="notif-text"><b>${escHTML(n.fromUser?.display_name||'Someone')}</b> challenged you to <b>${escHTML(gi.name||n.gameType)}</b> ${gi.icon||'🎮'}${timerHtml}</div>
              <div class="notif-time">${timeAgo}</div>
              ${actionsHtml}
            </div>
          </div>`;
      }
    }
  });
}

async function acceptNotifGame(sessionId, gameType, fromUser) {
  const { data: updated, error } = await sb.from('game_sessions').update({ status: 'active' }).eq('id', sessionId).eq('status','waiting').select().single();
  if (!updated && !error) { 
    // If not updated but no error, it might already be active (e.g. from another tab)
    rejoinGame(sessionId, gameType, fromUser);
    return;
  }
  if (error) { toast('Could not join game.', 'error'); return; }
  
  try { await sb.from('game_notifications').update({ status: 'accepted' }).eq('session_id', sessionId); } catch(e) {}
  const n = notifications.find(n => String(n.sessionId) === String(sessionId));
  if (n) { n.accepted = true; saveNotificationsToStorage(); }
  closePanel();
  toast(`Joined ${GAME_INFO[gameType]?.name||'game'}!`, 'success');
  openGameScreen(sessionId, gameType, false, fromUser.display_name);
}

function rejoinGame(sessionId, gameType, fromUser) {
  closePanel();
  toast(`Rejoining ${GAME_INFO[gameType]?.name||'game'}...`);
  // Check if we were the challenger or opponent for the correct perspective
  sb.from('game_sessions').select('challenger_id').eq('id', sessionId).single().then(({data}) => {
    const isChallenger = data && data.challenger_id === currentUser.id;
    openGameScreen(sessionId, gameType, isChallenger, fromUser.display_name);
  });
}

async function declineNotifGame(sessionId) {
  try { await sb.from('game_notifications').update({ status: 'declined' }).eq('session_id', sessionId); } catch(e) {}
  try { await sb.from('game_sessions').update({ status: 'finished' }).eq('id', sessionId); } catch(e) {}
  const n = notifications.find(n => String(n.sessionId) === String(sessionId));
  if (n) { n.declined = true; saveNotificationsToStorage(); }
  renderNotificationsPanel();
  toast('Game request declined.');
}

function formatTimeAgo(ts) {
  const diff = Date.now() - new Date(ts).getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}

// ===== TYPING =====
function subscribeToTyping() {
  typingSub && sb.removeChannel(typingSub);
  typingUsers = {}; updateTypingBar();
  typingSub = sb.channel(`typing:${currentChannel.id}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'typing', filter: `channel_id=eq.${currentChannel.id}` }, payload => {
      if (payload.eventType === 'DELETE') { delete typingUsers[payload.old?.user_id]; }
      else if (payload.new?.user_id !== currentUser?.id) { typingUsers[payload.new.user_id] = payload.new.display_name; }
      updateTypingBar();
    }).subscribe();
}
async function handleTyping() {
  const input = document.getElementById('msg-input');
  document.getElementById('send-btn').disabled = !input.value.trim();
  if (!currentUser) return;
  clearTimeout(typingTimeout);
  await sb.from('typing').upsert({ channel_id: currentChannel.id, user_id: currentUser.id, display_name: currentUser.display_name }, { onConflict: 'channel_id,user_id' });
  typingTimeout = setTimeout(async () => { await sb.from('typing').delete().eq('channel_id', currentChannel.id).eq('user_id', currentUser.id); }, 3000);
}
function updateTypingBar() {
  const bar = document.getElementById('typing-bar');
  const names = Object.values(typingUsers);
  if (!names.length) { bar.innerHTML = ''; return; }
  const label = names.length === 1 ? `${names[0]} is typing` : `${names.length} people are typing`;
